[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-agent"
version = "0.1.0"
description = "Production-quality Git repository agent for repository mining and software analytics"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "GitPython>=3.1.43",
  "PyGithub>=2.3.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
