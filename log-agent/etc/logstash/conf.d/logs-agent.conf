input {
  beats {
    port => 5044
  }
}

filter {
  if [metric] or [metric_name] or [collector] or [source] == "prometheus" {
    json {
      source => "message"
      target => "decoded_metric"
      skip_on_invalid_json => true
    }

    if [decoded_metric][metric_name] {
      mutate {
        rename => {
          "[decoded_metric][timestamp]" => "timestamp"
          "[decoded_metric][host]" => "host"
          "[decoded_metric][source]" => "source"
          "[decoded_metric][metric_name]" => "metric_name"
          "[decoded_metric][category]" => "category"
          "[decoded_metric][value]" => "value"
          "[decoded_metric][unit]" => "unit"
          "[decoded_metric][environment]" => "environment"
          "[decoded_metric][agent]" => "agent"
        }
      }
    }

    if [metric][name] {
      mutate {
        rename => {
          "[metric][name]" => "metric_name"
          "[metric][category]" => "category"
          "[metric][value]" => "value"
          "[metric][unit]" => "unit"
        }
      }
    }

    if [collector][name] {
      mutate {
        rename => { "[collector][name]" => "agent" }
      }
    }

    if ![host] and [host][name] {
      mutate {
        rename => { "[host][name]" => "host" }
      }
    }

    mutate {
      add_field => { "collection_timestamp" => "%{@timestamp}" }
    }

    if ![environment] {
      mutate {
        add_field => { "environment" => "test" }
      }
    }

    if ![agent] {
      mutate {
        replace => { "agent" => "logs-agent" }
      }
    }

    mutate {
      remove_field => ["decoded_metric", "metric", "collector", "event", "ecs", "input", "log", "tags", "message", "@version"]
    }
  }

  if ![timestamp] and [@timestamp] {
    mutate {
      copy => { "@timestamp" => "timestamp" }
    }
  }

  grok {
    match => {
      "message" => [
        "^%{SYSLOGTIMESTAMP:syslog_timestamp} %{HOSTNAME:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}$",
        "^%{TIMESTAMP_ISO8601:iso_timestamp} %{LOGLEVEL:log_level} %{GREEDYDATA:syslog_message}$",
        "^%{GREEDYDATA:syslog_message}$"
      ]
    }
    tag_on_failure => ["_logs_agent_grok_failure"]
  }

  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      ignore_failure => true
    }
  }

  if [syslog_timestamp] {
    date {
      match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      target => "@timestamp"
      ignore_failure => true
    }
  }

  mutate {
    rename => {
      "[host][name]" => "hostname"
      "[log][file][path]" => "source"
      "[service][name]" => "service"
      "[process][name]" => "process"
      "[log][level]" => "severity"
    }
  }

  ruby {
    code => '
      source = event.get("source") || event.get("[log][file][path]") || "unknown-source"
      message = event.get("message") || event.get("syslog_message") || ""
      service = event.get("service")

      if service.nil? || service.to_s.empty?
        detected = if source.include?("prometheus") || message.downcase.include?("prometheus")
          "prometheus"
        elsif source.include?("node_exporter") || message.downcase.include?("node exporter") || message.downcase.include?("node_exporter")
          "node_exporter"
        elsif event.get("[systemd][unit]")
          event.get("[systemd][unit]").to_s.sub(/\.service$/, "")
        elsif source.include?("secure")
          "auth"
        elsif source.include?("cron")
          "cron"
        elsif source.include?("dmesg") || message.downcase.include?("kernel")
          "kernel"
        else
          event.get("process") || event.get("[process][name]") || event.get("[syslog][appname]") || "system"
        end
        event.set("service", detected)
      end

      level = event.get("severity") || event.get("log_level") || event.get("level")
      if level.nil? || level.to_s.empty?
        lowered = message.downcase
        level = if lowered.include?("fatal") || lowered.include?("critical") || lowered.include?("panic")
          "CRITICAL"
        elsif lowered.include?("error") || lowered.include?("failed") || lowered.include?("exception")
          "ERROR"
        elsif lowered.include?("warn")
          "WARN"
        elsif lowered.include?("debug") || lowered.include?("trace")
          "DEBUG"
        else
          "INFO"
        end
      end

      event.set("severity", level.to_s.upcase)
      event.set("hostname", event.get("hostname") || event.get("[host][name]") || event.get("[agent][hostname]") || event.get("[fields][hostname]"))
      event.set("process", event.get("process") || event.get("[process][name]") || event.get("[syslog][appname]") || event.get("syslog_program"))
      event.set("source", source)
      event.set("message", message) if event.get("message").nil? || event.get("message").to_s.empty?

      tags = event.get("tags")
      tags = [] if tags.nil?
      tags = [tags] unless tags.is_a?(Array)
      tags << "logs-agent"
      tags << event.get("service").to_s if event.get("service")
      tags << "monitoring" if event.get("service").to_s == "prometheus" || event.get("service").to_s == "node_exporter"
      event.set("tags", tags.compact.uniq)
    '
  }

  mutate {
    remove_field => ["syslog_message", "syslog_hostname", "syslog_program", "syslog_pid", "iso_timestamp", "log_level"]
  }
}

output {
  if [metric_name] or [category] or [source] == "prometheus" {
    file {
      path => "output/prometheus_structured.json"
      codec => json_lines
    }
  } else {
    tcp {
      host => "127.0.0.1"
      port => 5000
      codec => json_lines
    }
  }
}
