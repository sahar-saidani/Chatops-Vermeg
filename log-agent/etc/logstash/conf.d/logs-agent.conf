input {
  beats {
    port => 5044
    client_inactivity_timeout => 300
  }
}

filter {
  if ![timestamp] and [@timestamp] {
    mutate {
      copy => {
        "@timestamp" => "timestamp"
      }
    }
  }

  ruby {
    code => '
      source = event.get("source") ||
               event.get("[winlog][channel]") ||
               "unknown-source"

      message = event.get("message") ||
                event.get("syslog_message") ||
                ""

      service = event.get("service")

      if service.nil? || service.to_s.empty?
        detected =
          if event.get("[winlog][channel]")
            event.get("[winlog][channel]").to_s
          elsif event.get("[systemd][unit]")
            event.get("[systemd][unit]").to_s.sub(/\.service$/, "")
          elsif source.to_s.include?("secure")
            "auth"
          elsif source.to_s.include?("cron")
            "cron"
          elsif source.to_s.include?("maillog")
            "mail"
          elsif source.to_s.include?("boot.log")
            "boot"
          elsif source.to_s.include?("dmesg") ||
                message.downcase.include?("kernel")
            "kernel"
          elsif source.to_s.include?("messages")
            "system"
          else
            event.get("process") ||
            event.get("[process][name]") ||
            event.get("[syslog][appname]") ||
            event.get("[winlog][provider_name]") ||
            "system"
          end

        event.set("service", detected)
      end

      level = event.get("severity") ||
              event.get("log_level") ||
              event.get("[winlog][level]") ||
              event.get("level")

      if level.nil? || level.to_s.empty?
        lowered = message.downcase

        level =
          if lowered.include?("fatal") ||
             lowered.include?("critical") ||
             lowered.include?("panic")
            "CRITICAL"
          elsif lowered.include?("error") ||
                lowered.include?("failed") ||
                lowered.include?("failure") ||
                lowered.include?("exception")
            "ERROR"
          elsif lowered.include?("warn")
            "WARN"
          elsif lowered.include?("debug") ||
                lowered.include?("trace")
            "DEBUG"
          else
            "INFO"
          end
      end

      event.set("severity", level.to_s.upcase)

      event.set(
        "hostname",
        event.get("hostname") ||
        event.get("[host][hostname]") ||
        event.get("[agent][hostname]") ||
        event.get("[fields][hostname]")
      )

      event.set(
        "process",
        event.get("process") ||
        event.get("[process][name]") ||
        event.get("[syslog][appname]") ||
        event.get("[winlog][provider_name]") ||
        event.get("syslog_program")
      )

      event.set("source", source)

      if event.get("message").nil? ||
         event.get("message").to_s.empty?
        event.set("message", message)
      end

      tags = event.get("tags") || []
      tags = [tags] unless tags.is_a?(Array)

      tags << "logs-agent"

      if event.get("service")
        tags << event.get("service").to_s
      end

      event.set("tags", tags.compact.uniq)
    '
  }
}

output {
  tcp {
    host => "127.0.0.1"
    port => 5000
    codec => json_lines
  }

  if "${LOGSTASH_DEBUG:false}" == "true" {
    stdout {
      codec => rubydebug
    }
  }
}