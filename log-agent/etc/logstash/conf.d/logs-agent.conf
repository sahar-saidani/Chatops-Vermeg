# Logstash pipeline shared by every machine (CentOS and Windows).
#
# Filebeat -> Logstash (this file) -> log-agent (127.0.0.1:5000)
#
# This pipeline only normalizes log events (Linux syslog/journald and
# Windows Event Logs). It does not touch tenant_name / environment_name /
# environment_type / machine_reference: those fields are set by Filebeat
# from this machine's environment variables and are passed through as-is.

input {
  beats {
    port => 5044
  }
}

filter {
  if ![timestamp] and [@timestamp] {
    mutate {
      copy => { "@timestamp" => "timestamp" }
    }
  }

  # NOTE: the surrounding blocks below (the ones handling generic
  # timestamp/host/message normalization that were already present before
  # the Prometheus removal) were unchanged by the diff you pasted, so they
  # are reproduced here as placeholders. If your original file had more
  # filter logic here between the timestamp copy and the ruby block below,
  # paste it and I will merge it in — the diff you gave me only showed the
  # ruby block and the input/output blocks changing.

  # Fill in source/service/process/level/hostname from whichever ECS or
  # winlog fields are present, tolerating the differences between Linux
  # (Filebeat file/journald inputs) and Windows (Filebeat winlog input).
  ruby {
    code => '
      source = event.get("source") || event.get("[winlog][channel]") || "unknown-source"
      message = event.get("message") || event.get("syslog_message") || ""
      service = event.get("service")

      if service.nil? || service.to_s.empty?
        detected = if event.get("[winlog][channel]")
          event.get("[winlog][channel]").to_s
        elsif event.get("[systemd][unit]")
          event.get("[systemd][unit]").to_s.sub(/\.service$/, "")
        elsif source.to_s.include?("secure")
          "auth"
        elsif source.to_s.include?("cron")
          "cron"
        elsif source.to_s.include?("maillog")
          "mail"
        elsif source.to_s.include?("boot.log")
          "boot"
        elsif source.to_s.include?("dmesg") || message.downcase.include?("kernel")
          "kernel"
        elsif source.to_s.include?("messages")
          "system"
        else
          event.get("process") || event.get("[process][name]") || event.get("[syslog][appname]") || event.get("[winlog][provider_name]") || "system"
        end
        event.set("service", detected)
      end

      level = event.get("severity") || event.get("log_level") || event.get("[winlog][level]") || event.get("level")
      if level.nil? || level.to_s.empty?
        lowered = message.downcase
        level = if lowered.include?("fatal") || lowered.include?("critical") || lowered.include?("panic")
          "CRITICAL"
        elsif lowered.include?("error") || lowered.include?("failed") || lowered.include?("failure") || lowered.include?("exception")
          "ERROR"
        elsif lowered.include?("warn")
          "WARN"
        elsif lowered.include?("debug") || lowered.include?("trace")
          "DEBUG"
        else
          "INFO"
        end
      end

      event.set("severity", level.to_s.upcase)
      event.set("hostname", event.get("hostname") || event.get("[host][hostname]") || event.get("[agent][hostname]") || event.get("[fields][hostname]"))
      event.set("process", event.get("process") || event.get("[process][name]") || event.get("[syslog][appname]") || event.get("[winlog][provider_name]") || event.get("syslog_program"))
      event.set("source", source)
      event.set("message", message) if event.get("message").nil? || event.get("message").to_s.empty?

      tags = event.get("tags") || []
      tags = [tags] unless tags.is_a?(Array)
      tags << "logs-agent"
      tags << event.get("service").to_s if event.get("service")
      event.set("tags", tags.compact.uniq)
    '
  }
}

output {
  # Local-only: this Logstash only ever talks to the log-agent running on
  # the same machine, never a remote one.
  tcp {
    host => "127.0.0.1"
    port => 5000
    codec => json_lines
  }

  # Optional debug output for tests. Enable with:
  #   LOGSTASH_DEBUG=true /usr/share/logstash/bin/logstash --path.settings /etc/logstash
  if "${LOGSTASH_DEBUG:false}" == "true" {
    stdout { codec => rubydebug }
  }
}