# Common config.yaml shipped as-is to every machine (CentOS and Windows).
# Nothing tenant/environment/machine-specific is hardcoded here: the
# machine identity below is always resolved from the environment variables
# TENANT_NAME / ENVIRONMENT_NAME / ENVIRONMENT_TYPE / MACHINE_REFERENCE /
# NODE_ROLE at startup (see machine_identity.with_env_overrides()).

server:
  host: "0.0.0.0"
  port: 5000

normalization:
  max_message_length: 8192
  dedup_window_seconds: 5

logging:
  level: "INFO"

rabbitmq:
  enabled: true
  url: "amqp://guest:guest@localhost:5672/"

# Per-machine identity - always overridden by TENANT_NAME/ENVIRONMENT_NAME/
# ENVIRONMENT_TYPE/MACHINE_REFERENCE/NODE_ROLE env vars, so the same
# config.yaml ships unchanged to every machine.
machine:
  tenant_name: "MAIF"
  environment_name: "DEV"
  environment_type: "STANDALONE"
  machine_reference: "MAIF-WINDOWS-01"
  node_role: null