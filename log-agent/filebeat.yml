# Filebeat configuration for Linux (CentOS) machines.
#
# Collects Linux system logs and forwards them to the local Logstash
# instance on 127.0.0.1:5044. Every event is tagged with this machine's
# identity, read from the environment (TENANT_NAME / ENVIRONMENT_NAME /
# ENVIRONMENT_TYPE / MACHINE_REFERENCE). Set these before starting Filebeat,
# e.g.:
#
#   export TENANT_NAME=NNBE
#   export ENVIRONMENT_NAME=DEV
#   export ENVIRONMENT_TYPE=STANDALONE
#   export MACHINE_REFERENCE=NNBE-DEV-01

filebeat.inputs:
  - type: filestream
    id: linux-system-logs
    enabled: true
    paths:
      - /var/log/messages
      - /var/log/secure
      - /var/log/cron
      - /var/log/maillog
      - /var/log/boot.log
      - /var/log/dmesg
    parsers:
      - multiline:
          type: pattern
          pattern: '^[[:space:]]'
          negate: false
          match: after
          timeout: 5s
    fields_under_root: true
    fields:
      log_source: file
      service_name: linux-system
      tags:
        - linux
        - system
        - logs-agent
    processors:
      - add_host_metadata: ~
      - add_fields:
          target: ""
          fields:
            hostname: "${HOSTNAME}"
      - copy_fields:
          fields:
            - from: "@timestamp"
              to: "timestamp"
          fail_on_error: false
          ignore_missing: true

  - type: journald
    id: linux-systemd-journal
    enabled: true
    seek: cursor
    tags:
      - linux
      - systemd
      - journal
      - logs-agent
    processors:
      - add_host_metadata: ~
      - add_fields:
          target: ""
          fields:
            log_source: journal
            service_name: systemd
            hostname: "${HOSTNAME}"
      - copy_fields:
          fields:
            - from: "@timestamp"
              to: "timestamp"
          fail_on_error: false
          ignore_missing: true

processors:
  - add_locale: ~
  # Machine identity, applied to every event this Filebeat instance ships,
  # regardless of which input produced it. Values always come from the
  # environment - never hardcode a tenant/environment here.
  - add_fields:
      target: ""
      fields:
        tenant_name: "${TENANT_NAME}"
        environment_name: "${ENVIRONMENT_NAME}"
        environment_type: "${ENVIRONMENT_TYPE}"
        machine_reference: "${MACHINE_REFERENCE}"

output.logstash:
  hosts:
    - "127.0.0.1:5044"
  loadbalance: false
  compression_level: 3
  ssl.enabled: false

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644