spring:
  application:
    name: chatops-vermeg
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:3600000}
  authentication:
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:2592000000}

chatops:
  authentication:
    frontend-base-url: ${AUTH_FRONTEND_BASE_URL:http://localhost:3000}
    mail-from: ${AUTH_MAIL_FROM:no-reply@chatops-vermeg.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
